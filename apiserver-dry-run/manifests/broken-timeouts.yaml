# The backend may take longer than the whole request.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-slow
  namespace: shop
spec:
  parentRefs:
    - name: public
  rules:
    - timeouts:
        request: 10s
        backendRequest: 30s
      backendRefs:
        - name: web
          port: 80
