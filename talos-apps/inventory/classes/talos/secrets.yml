# Cluster secrets as Kapitan refs. check fills them from a fresh
# `talosctl gen secrets` bundle; refs under cluster.ca, aggregatorCA and
# serviceAccount hold PEM, the others the bundle's value as is.
parameters:
  generators:
    talos:
      base:
        machine:
          token: ?{base64:talos/machine-token}
          ca:
            crt: ?{base64:talos/machine-ca-crt}
            key: ?{base64:talos/machine-ca-key}
        cluster:
          id: ?{base64:talos/cluster-id}
          secret: ?{base64:talos/cluster-secret}
          token: ?{base64:talos/cluster-token}
          secretboxEncryptionSecret: ?{base64:talos/secretbox}
          ca:
            crt: ?{base64:talos/cluster-ca-crt}
            key: ?{base64:talos/cluster-ca-key}
          aggregatorCA:
            crt: ?{base64:talos/aggregator-ca-crt}
            key: ?{base64:talos/aggregator-ca-key}
          serviceAccount:
            key: ?{base64:talos/service-account-key}
          etcd:
            ca:
              crt: ?{base64:talos/etcd-ca-crt}
              key: ?{base64:talos/etcd-ca-key}
