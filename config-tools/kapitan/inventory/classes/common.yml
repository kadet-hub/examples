parameters:
  namespace: shop
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.13.0@sha256:5b891d4217d74a518a8da14315a80185c763fe18bce1121c1fb24507bf23daf0
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths: [lib/kubernetes]
        output_path: manifests/
  generators:
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
