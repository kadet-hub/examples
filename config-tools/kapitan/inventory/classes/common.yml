parameters:
  namespace: shop
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.12.0@sha256:970bf8cafbea30fc00f3092d19133b1c9fef8249036bbaee3d66800ac1b29ffc
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths: [lib/kubernetes]
        output_path: manifests/
  generators:
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
