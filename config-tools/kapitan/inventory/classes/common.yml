parameters:
  namespace: shop
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.9.1@sha256:9e428f838c4bed6f1e571a90c256cdc3fc2f95743a3291245dcc776103022f19
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths: [lib/kubernetes]
        output_path: manifests/
  generators:
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
