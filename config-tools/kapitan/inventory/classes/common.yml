parameters:
  namespace: shop
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.6.0@sha256:bdd38ce351fc448440a52991e775b723265e3aa52c1ba9deb8fe5e086d35125d
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths: [lib/kubernetes]
        output_path: manifests/
  generators:
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
