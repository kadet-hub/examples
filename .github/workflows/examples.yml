name: examples

# EX-1, EX-2: each example's script on every change and weekly, so a post
# whose claim no longer holds shows up as a failed run.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

# EX-3: Renovate updates the checksums of release-asset and image pins; the
# pins job checks the others against their publisher's checksum file.
env:
  # renovate: datasource=github-release-attachments depName=astral-sh/uv
  UV_VERSION: 0.13.1
  UV_SHA256: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
  # renovate: datasource=github-release-attachments depName=oras-project/oras
  ORAS_VERSION: v1.3.4
  ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
  # renovate: datasource=github-release-attachments depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  # renovate: datasource=docker depName=registry.k8s.io/kustomize/kustomize
  KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4
  # renovate: datasource=github-release-attachments depName=pulumi/pulumi
  PULUMI_VERSION: v3.270.0
  PULUMI_SHA256: d05899c251cb0413a9a2304f23229218c46852a61256913f34f08ebc27266139
  # Provider plugin linux-amd64 archive at the @pulumi/kubernetes version in
  # same-app/pulumi/package-lock.json, checked by same-app/check.
  # renovate: datasource=github-release-attachments depName=pulumi/pulumi-kubernetes
  PULUMI_KUBERNETES_VERSION: v4.34.2
  PULUMI_KUBERNETES_SHA256: b2a3471a897d8d4aa5c6f0ea2933d363dfa72bee8ed651a16246a09e3e728bb6
  # renovate: datasource=docker depName=registry.k8s.io/kube-apiserver
  KUBE_APISERVER_IMAGE: registry.k8s.io/kube-apiserver:v1.37.1@sha256:e190f914a6cc21cab9268485d1ae7282fdeab1315ac64b668aa42d732fd1061d
  # renovate: datasource=docker depName=registry.k8s.io/kubectl
  KUBECTL_IMAGE: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
  # renovate: datasource=github-release-attachments depName=etcd-io/etcd
  ETCD_VERSION: v3.7.2
  ETCD_SHA256: 3a3679bc51a4ee9d30bccea1da7cd4fe62c6fc1d2ca1255068d2c53bf3026135
  # renovate: datasource=github-release-attachments depName=grafana/tanka
  TANKA_VERSION: v0.39.4
  TANKA_SHA256: 71961ae30b65097c24ad481dca599116aea6b01bfe0e2ec03ab643884076443a
  # renovate: datasource=github-release-attachments depName=jsonnet-bundler/jsonnet-bundler
  JB_VERSION: v0.6.0
  JB_SHA256: 78e54afbbc3ff3e0942b1576b4992277df4f6beb64cddd58528a76f0cd70db54
  # renovate: datasource=node-version depName=node
  NODE_VERSION: 26.12.0
  NODE_SHA256: fd47865ecd6391ebb431fc815e01b9135bf83ded5cf373247e9331e196b7aded
  # renovate: datasource=github-release-attachments depName=google/gvisor
  GVISOR_RELEASE: release-20261012.0
  GVISOR_SHA512: ce2e1aeb853c104e854dea6644333a1dba0fbc9dd1646af97e1d013fdf810da6d4176dd96f2139d7b055e5382117c0d7c4567ebd64ed9bef47fdd15f80fd67ab
  # renovate: datasource=github-release-attachments depName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # renovate: datasource=github-release-attachments depName=kyverno/chainsaw
  CHAINSAW_VERSION: v0.2.15
  CHAINSAW_SHA256: 295d226c89f126c0a97775d364be149f47a810c8a3f9829ee410583d0c1abe3c
  # renovate: datasource=github-release-attachments depName=siderolabs/talos
  TALOSCTL_VERSION: v1.14.4
  TALOSCTL_SHA256: 0a69e3f9b682c5cd844b78dae305f6056ceb86c5fcc6913dcea78c527ed97cee
  # renovate: datasource=github-release-attachments depName=opentofu/opentofu
  TOFU_VERSION: v1.13.1
  TOFU_SHA256: 378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69

jobs:
  same-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, kustomize, Pulumi, Node.js, oras and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSLo pulumi.tgz "https://github.com/pulumi/pulumi/releases/download/$PULUMI_VERSION/pulumi-$PULUMI_VERSION-linux-x64.tar.gz"
          curl -fsSLo node.txz "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $HELM_SHA256  helm.tgz
          $PULUMI_SHA256  pulumi.tgz
          $NODE_SHA256  node.txz
          $ORAS_SHA256  oras.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          c=$(docker create "$KUSTOMIZE_IMAGE") && docker cp -q "$c:/app/kustomize" . && docker rm "$c" >/dev/null
          tar -xzf pulumi.tgz --strip-components=1 pulumi/pulumi pulumi/pulumi-language-nodejs
          tar -xJf node.txz --strip-components=1 -C "$RUNNER_TEMP/node"
          tar -xzf oras.tgz oras
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm node.txz ./*.tgz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: same-app/check
        env:
          GH_TOKEN: ${{ github.token }}
          npm_config_update_notifier: "false"
        run: same-app/check

  apiserver-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kube-apiserver, kubectl, etcd, kubeconform and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo etcd.tgz "https://github.com/etcd-io/etcd/releases/download/$ETCD_VERSION/etcd-$ETCD_VERSION-linux-amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $ETCD_SHA256  etcd.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf etcd.tgz --strip-components=1 "etcd-$ETCD_VERSION-linux-amd64/etcd"
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm ./*.tgz
          c=$(docker create "$KUBE_APISERVER_IMAGE") && docker cp -q "$c:/usr/local/bin/kube-apiserver" . && docker rm "$c" >/dev/null
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: apiserver-dry-run/check

  # EX-12: prod's apps deployed to kind.
  first-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras, kubeconform, uv, kubectl and kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          sha256sum -c <<EOF
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          $KIND_SHA256  kind
          EOF
          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          chmod +x kubectl kind
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: first-platform/check
        env:
          GH_TOKEN: ${{ github.token }}
        run: first-platform/check

  bitnami:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras, kubeconform and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: bitnami/run.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: bitnami/run.sh

  verify-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # gh attestation verify
      packages: read # gh reads the attestations of ghcr.io artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify-oci/verify
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=docker depName=ghcr.io/kadet-hub/kubernetes
          GENERATOR_VERSION: 1.2.0
        run: verify-oci/verify kubernetes "$GENERATOR_VERSION" 47

  gvisor-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install runsc and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo gvisor.tar.zstd "https://github.com/google/gvisor/releases/download/$GVISOR_RELEASE/gvisor-x86_64.tar.zstd"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$GVISOR_SHA512  gvisor.tar.zstd" | sha512sum -c -
          echo "$UV_SHA256  uv.tgz" | sha256sum -c -
          # runsc starts its sidecars from gvisor-bin/ next to it, so unpack everything.
          tar --zstd -xf gvisor.tar.zstd
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm gvisor.tar.zstd uv.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # ubuntu-24.04 restricts unprivileged user namespaces with AppArmor, which
      # rootless runsc needs (fork/exec /proc/self/exe: permission denied).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: gvisor-ci/check

  config-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tk, jb, Node.js, oras and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo tk "https://github.com/grafana/tanka/releases/download/$TANKA_VERSION/tk-linux-amd64"
          curl -fsSLo jb "https://github.com/jsonnet-bundler/jsonnet-bundler/releases/download/$JB_VERSION/jb-linux-amd64"
          curl -fsSLo node.txz "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $TANKA_SHA256  tk
          $JB_SHA256  jb
          $NODE_SHA256  node.txz
          $ORAS_SHA256  oras.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xJf node.txz --strip-components=1 -C "$RUNNER_TEMP/node"
          tar -xzf oras.tgz oras
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm node.txz ./*.tgz
          chmod +x tk jb
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: config-tools/check
        env:
          GH_TOKEN: ${{ github.token }}
          npm_config_update_notifier: "false"
        run: config-tools/check

  talos-machine-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install talosctl, oras and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo talosctl "https://github.com/siderolabs/talos/releases/download/$TALOSCTL_VERSION/talosctl-linux-amd64"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $TALOSCTL_SHA256  talosctl
          $ORAS_SHA256  oras.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf oras.tgz oras
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm ./*.tgz
          chmod +x talosctl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: talos-machine-config/check
        env:
          GH_TOKEN: ${{ github.token }}
        run: talos-machine-config/check


  # EX-12: the app deployed to kind.
  helm-vs-terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras, kubeconform, uv, tofu, kubectl and kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo tofu.tgz "https://github.com/opentofu/opentofu/releases/download/$TOFU_VERSION/tofu_${TOFU_VERSION#v}_linux_amd64.tar.gz"
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          sha256sum -c <<EOF
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          $TOFU_SHA256  tofu.tgz
          $KIND_SHA256  kind
          EOF
          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          tar -xzf tofu.tgz tofu
          chmod +x kubectl kind
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: helm-vs-terraform/check
        env:
          GH_TOKEN: ${{ github.token }}
        run: helm-vs-terraform/check

  # EX-6: each recipe deployed to its own kind cluster and checked.
  recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        recipe: [postgresql, keycloak, valkey, kafka, rabbitmq, external-dns-powerdns, mysql, mongodb]
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, oras, kubeconform, uv, kubectl, kind and chainsaw
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          curl -fsSLo chainsaw.tgz "https://github.com/kyverno/chainsaw/releases/download/$CHAINSAW_VERSION/chainsaw_linux_amd64.tar.gz"
          sha256sum -c <<EOF
          $HELM_SHA256  helm.tgz
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          $KIND_SHA256  kind
          $CHAINSAW_SHA256  chainsaw.tgz
          EOF
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          tar -xzf chainsaw.tgz chainsaw
          chmod +x kind
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: recipes/check ${{ matrix.recipe }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ matrix.recipe }}
        run: recipes/check "$RECIPE"

  # EX-7, EX-8: the same app delivered by Argo CD and by Flux, one kind cluster each.
  argocd-vs-flux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [argocd, flux]
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras, kubeconform, uv, kubectl, kind and chainsaw
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          curl -fsSLo chainsaw.tgz "https://github.com/kyverno/chainsaw/releases/download/$CHAINSAW_VERSION/chainsaw_linux_amd64.tar.gz"
          sha256sum -c <<EOF
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          $KIND_SHA256  kind
          $CHAINSAW_SHA256  chainsaw.tgz
