name: examples

# EX-1, EX-2, EX-2a: every example's script on a push to main, weekly and
# on a manual run, and on a pull request the scripts of the example folders
# it changes, so a post whose claim no longer holds shows up as a failed run.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

