  # EX-3f: published advisories for the packages in the lock files.
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: osv-scanner scan source -r .

  # EX-3: Renovate bumps these versions only; the checksum comes from the
  # publisher, and the failure names the line to paste.
  pins:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checksums against the publishers' checksum files
        run: |
          status=0
          # check <file> <line prefix> <pinned> <checksum file URL> [<name in it>]
          check() {
            local sum
            if (($# == 5)); then
              sum=$(curl -fsSL "$4" | awk -v f="$5" '$2 == f || $2 == "*" f { print $1 }')
            else
              sum=$(curl -fsSL "$4" | sha256sum | cut -d' ' -f1)
            fi || { echo "::error file=$1::cannot download $4"; exit 1; }
            if [[ -z $sum ]]; then
              echo "::error file=$1::$5 is not listed in $4"; status=1
            elif [[ $sum != "$3" ]]; then
              echo "::error file=$1::checksum differs from $4; set this line: $2$sum"; status=1
            fi
          }
          check .github/workflows/examples.yml "  HELM_SHA256: " "$HELM_SHA256" \
            "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz.sha256sum" "helm-$HELM_VERSION-linux-amd64.tar.gz"
          check .github/workflows/examples.yml "  NODE_SHA256: " "$NODE_SHA256" \
            "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" "node-v$NODE_VERSION-linux-x64.tar.xz"
          # The apiserver-dry-run template downloads both binaries from dl.k8s.io.
          f=apiserver-dry-run/.github/workflows/dry-run.yml
          v=$(sed -n 's/^ *KUBERNETES_VERSION: //p' "$f")
          check "$f" "      KUBE_APISERVER_SHA256: " "$(sed -n 's/^ *KUBE_APISERVER_SHA256: //p' "$f")" \
            "https://dl.k8s.io/release/$v/bin/linux/amd64/kube-apiserver"
          check "$f" "      KUBECTL_SHA256: " "$(sed -n 's/^ *KUBECTL_SHA256: //p' "$f")" \
            "https://dl.k8s.io/release/$v/bin/linux/amd64/kubectl"
          exit "$status"

  # EX-16: the one required check. Every other job goes into needs.
  ci:
    needs:
      - changes
      - same-app
      - apiserver-dry-run
      - first-platform
      - bitnami
      - verify-oci
      - gvisor-ci
      - config-tools
      - timoni-vs-kapitan
      - kcl-vs-kapitan
      - talos-machine-config
      - helm-vs-terraform
      - argocd-vs-flux
      - helm-mutate
      - chart-vs-kapitan
      - cert-manager-mutate
      - kubevirt-csi
      - open-webui-searxng
      - platform-baseline
      - immich-cnpg
      - pihole-powerdns
      - helmfile-vs-kapitan
      - argocd-cmp
      - policy-checks
      - secrets-end-to-end
      - multi-env
      - talos-apps
      - compose-kubernetes
      - sso-keycloak
      - advisories
      - pins
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! grep -qwE 'failure|cancelled' <<<"$RESULTS"
