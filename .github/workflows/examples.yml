jobs:
  # EX-2a: the example folders whose jobs run, as a JSON list.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      folders: ${{ steps.folders.outputs.folders }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request's merge commit and its base
      - id: folders
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          # -z: without it git quotes a path with a non-ASCII byte, folder included.
          if [[ $EVENT == pull_request ]]; then
            # The checkout is the merge commit; its first parent is the base branch.
            files=$(git diff -z --no-renames --name-only HEAD^ HEAD | tr '\0' '\n')
          fi
          # Everything runs on a push, the schedule, a manual run and a change
          # to the workflow, which sets the tools of every job.
          if [[ $EVENT != pull_request ]] || grep -q '^\.github/' <<<"$files"; then
            files=$(git ls-files -z | tr '\0' '\n')
          fi
          # helm-mutate deploys the Git server of argocd-vs-flux.
          if grep -qx argocd-vs-flux/git-server.yaml <<<"$files"; then
            files+=$'\nhelm-mutate/'
          fi
          folders=$(cut -s -d/ -f1 <<<"$files" | sort -u | jq -Rnc '[inputs]')
          echo "folders=$folders" | tee -a "$GITHUB_OUTPUT"

  same-app:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'same-app')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, Helmfile, kustomize, Pulumi, Node.js, oras and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSLo helmfile.tgz "https://github.com/helmfile/helmfile/releases/download/$HELMFILE_VERSION/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo pulumi.tgz "https://github.com/pulumi/pulumi/releases/download/$PULUMI_VERSION/pulumi-$PULUMI_VERSION-linux-x64.tar.gz"
          curl -fsSLo node.txz "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $HELM_SHA256  helm.tgz
          $HELMFILE_SHA256  helmfile.tgz
          $PULUMI_SHA256  pulumi.tgz
          $NODE_SHA256  node.txz
          $ORAS_SHA256  oras.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          tar -xzf helmfile.tgz helmfile
          c=$(docker create "$KUSTOMIZE_IMAGE") && docker cp -q "$c:/app/kustomize" . && docker rm "$c" >/dev/null
          tar -xzf pulumi.tgz --strip-components=1 pulumi/pulumi pulumi/pulumi-language-nodejs
          tar -xJf node.txz --strip-components=1 -C "$RUNNER_TEMP/node"
          tar -xzf oras.tgz oras
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm node.txz ./*.tgz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: same-app/check
        env:
          GH_TOKEN: ${{ github.token }}
          npm_config_update_notifier: "false"
        run: same-app/check

  apiserver-dry-run:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'apiserver-dry-run')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kube-apiserver, kubectl, etcd, kubeconform and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo etcd.tgz "https://github.com/etcd-io/etcd/releases/download/$ETCD_VERSION/etcd-$ETCD_VERSION-linux-amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $ETCD_SHA256  etcd.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf etcd.tgz --strip-components=1 "etcd-$ETCD_VERSION-linux-amd64/etcd"
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm ./*.tgz
          c=$(docker create "$KUBE_APISERVER_IMAGE") && docker cp -q "$c:/usr/local/bin/kube-apiserver" . && docker rm "$c" >/dev/null
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: apiserver-dry-run/check

  # EX-12: prod's apps deployed to kind.
  first-platform:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'first-platform')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras, kubeconform, uv, kubectl and kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          c=$(docker create "$KUBECTL_IMAGE") && docker cp -q "$c:/bin/kubectl" . && docker rm "$c" >/dev/null
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          sha256sum -c <<EOF
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          $KIND_SHA256  kind
          EOF
          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          chmod +x kubectl kind
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: first-platform/check
        env:
          GH_TOKEN: ${{ github.token }}
        run: first-platform/check

  bitnami:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'bitnami')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras, kubeconform and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $ORAS_SHA256  oras.tgz
          $KUBECONFORM_SHA256  kubeconform.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: bitnami/run.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: bitnami/run.sh

  verify-oci:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'verify-oci')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # gh attestation verify
      packages: read # gh reads the attestations of ghcr.io artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify-oci/verify
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=docker depName=ghcr.io/kadet-hub/kubernetes
          GENERATOR_VERSION: 1.14.0
        run: verify-oci/verify kubernetes "$GENERATOR_VERSION" 47

  gvisor-ci:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'gvisor-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install runsc and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo gvisor.tar.zstd "https://github.com/google/gvisor/releases/download/$GVISOR_RELEASE/gvisor-x86_64.tar.zstd"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$GVISOR_SHA512  gvisor.tar.zstd" | sha512sum -c -
          echo "$UV_SHA256  uv.tgz" | sha256sum -c -
          # runsc starts its sidecars from gvisor-bin/ next to it, so unpack everything.
          tar --zstd -xf gvisor.tar.zstd
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm gvisor.tar.zstd uv.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # EX-1b: runsc enforces no memory limit on a host with swap (google/gvisor#15756).
      - name: Show swap
        run: swapon --show
      # ubuntu-24.04 restricts unprivileged user namespaces with AppArmor, which
      # rootless runsc needs (fork/exec /proc/self/exe: permission denied).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # EX-1a: the Docker comparison in gvisor-ci/check needs runsc as a
      # Docker runtime, which takes root and a daemon restart, as the gate's
      # trace runtime does.
      - name: Register runsc as a Docker runtime
        run: |
          sudo "$(command -v runsc)" install
          sudo systemctl restart docker
      - run: gvisor-ci/check

  config-tools:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'config-tools')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tk, jb, Node.js, oras and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo tk "https://github.com/grafana/tanka/releases/download/$TANKA_VERSION/tk-linux-amd64"
          curl -fsSLo jb "https://github.com/jsonnet-bundler/jsonnet-bundler/releases/download/$JB_VERSION/jb-linux-amd64"
          curl -fsSLo node.txz "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $TANKA_SHA256  tk
          $JB_SHA256  jb
          $NODE_SHA256  node.txz
          $ORAS_SHA256  oras.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xJf node.txz --strip-components=1 -C "$RUNNER_TEMP/node"
          tar -xzf oras.tgz oras
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm node.txz ./*.tgz
          chmod +x tk jb
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: config-tools/check
        env:
          GH_TOKEN: ${{ github.token }}
          npm_config_update_notifier: "false"
        run: config-tools/check

  timoni-vs-kapitan:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'timoni-vs-kapitan')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install timoni, oras and uv
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo timoni.tgz "https://github.com/stefanprodan/timoni/releases/download/$TIMONI_VERSION/timoni_${TIMONI_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo oras.tgz "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo uv.tgz "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c <<EOF
          $TIMONI_SHA256  timoni.tgz
          $ORAS_SHA256  oras.tgz
          $UV_SHA256  uv.tgz
          EOF
          tar -xzf timoni.tgz timoni
          tar -xzf oras.tgz oras
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: timoni-vs-kapitan/check
        env:
          GH_TOKEN: ${{ github.token }}
        run: timoni-vs-kapitan/check

  kcl-vs-kapitan:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'kcl-vs-kapitan')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kcl, oras and uv
        run: |
