          tar -xzf oras.tgz oras
          tar -xzf kubeconform.tgz kubeconform
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          tar -xzf chainsaw.tgz chainsaw
          chmod +x kubectl kind
          rm ./*.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: argocd-vs-flux/check ${{ matrix.tool }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ matrix.tool }}
        run: argocd-vs-flux/check "$TOOL"

  # EX-9, EX-10: podinfo's chart patched by mutate, deployed by kubectl, Argo CD
