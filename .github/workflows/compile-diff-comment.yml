name: compile-diff-comment

# EX-25: post the diff of a compile-diff run on its pull request. Runs from
# the default branch and checks out nothing, so a fork's pull request
# reaches it only as the text of the artifact.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] runs nothing from the pull request
    workflows: [compile-diff]
    types: [completed]

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read # the artifact of the compile-diff run
    steps:
      - uses: kadet-hub/registry/.github/actions/compile-diff-comment@ed0973860f5a9c7c03561b8aeec32ea568d4191e # main, kadet-hub/registry#560; no index tag at this commit
