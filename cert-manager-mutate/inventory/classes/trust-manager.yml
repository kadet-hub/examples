# trust-manager's chart, pinned by version and by the digest of its OCI
# artifact, rendered with Kapitan's helm input into compiled/<target>/trust-manager,
# in cert-manager, its default trust namespace. The values take tag and
# digest for both images.
parameters:
  kapitan:
    dependencies:
      - type: helm
        source: oci://quay.io/jetstack/charts/trust-manager@sha256:946c6e52f0a6e251c81102de83ffc6e0b11446193bed8670d4cdbfd3cecbc2e8
        chart_name: trust-manager
        version: v0.26.0
        output_path: charts/trust-manager
    compile:
      - input_type: helm
        input_paths: [charts/trust-manager]
        output_path: trust-manager
        helm_params:
          name: trust-manager
          namespace: cert-manager
        helm_values:
          image:
            repository: quay.io/jetstack/trust-manager
            tag: v0.26.0
            digest: sha256:783afe31d39f122a811b96ac3aedab9f358488088df21622ae5b057b4a38b5c2
          defaultPackageImage:
            repository: quay.io/jetstack/trust-pkg-debian-trixie
            tag: 20250419-deb13u1.1
            digest: sha256:477cc69ef6a026b90a6d67d4ac7114735c5f66edf1cc97e68b9da599adf231af
