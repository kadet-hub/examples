# cert-manager's chart, pinned by version and by the digest of its OCI
# artifact, rendered with Kapitan's helm input into compiled/<target>/cert-manager.
# The values take tag and digest for each image; startupapicheck is a Helm
# hook that waits for the webhook during helm install and is left out.
parameters:
  kapitan:
    dependencies:
      - type: helm
        source: oci://quay.io/jetstack/charts/cert-manager@sha256:634dce9c13b56677a2c05e2ab76c312d0be2664022d5dd05815da67e1fd5f610
        chart_name: cert-manager
        version: v1.21.2
        output_path: charts/cert-manager
    compile:
      - input_type: helm
        input_paths: [charts/cert-manager]
        output_path: cert-manager
        helm_params:
          name: cert-manager
          namespace: cert-manager
        helm_values:
          crds:
            enabled: true
          startupapicheck:
            enabled: false
          image:
            repository: quay.io/jetstack/cert-manager-controller
            tag: v1.21.2
            digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
          webhook:
            image:
              repository: quay.io/jetstack/cert-manager-webhook
              tag: v1.21.2
              digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
          cainjector:
            image:
              repository: quay.io/jetstack/cert-manager-cainjector
              tag: v1.21.2
              digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
          acmesolver:
            image:
              repository: quay.io/jetstack/cert-manager-acmesolver
              tag: v1.21.2
              digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
