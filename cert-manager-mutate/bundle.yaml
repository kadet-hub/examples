# The CA of internal-ca as a ConfigMap in every namespace. trust-manager's
# webhook admits the Bundle, so creating it needs the caBundle cainjector
# copied from the webhook's Secret.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: internal-ca
spec:
  sources:
    - secret:
        name: internal-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
