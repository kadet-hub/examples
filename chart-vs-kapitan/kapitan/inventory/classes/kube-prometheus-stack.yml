# The prometheus-operator generator, the rules and dashboards compiled from
# their upstream sources (../../components/, ../../jsonnetfile.json), and the
# operator's CRDs, downloaded and checked by ../../../check.
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/prometheus-operator:1.1.5@sha256:e335e3a8ab4a8f41272396311a4baf99f2874aa408375e80c0e846a49920747b
        output_path: lib/prometheus-operator
    compile:
      - input_type: kadet
        input_paths: [lib/prometheus-operator]
        output_path: manifests/
      - input_type: jsonnet
        input_paths: [components/kube-prometheus-stack.jsonnet]
        output_path: manifests/
      - input_type: copy
        input_paths: [vendor/prometheus-operator-crds.yaml]
        output_path: manifests/
