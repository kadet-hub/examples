# Vaultwarden from the published recipe. Its admin token comes from Vault
# through External Secrets. The one secret Kapitan carries is the AppRole
# secret ID that External Secrets logs in to Vault with.
classes:
  - recipes.vaultwarden
parameters:
  namespace: vaultwarden
  kapitan:
    vars:
      target: vaultwarden
    secrets:
      gpg:
        recipients:
          - name: secrets-end-to-end@example.com
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/external-secrets:1.0.6@sha256:184e8a60f92c0c09eae32973ceaf909b2da53457e88233161ffb90c4b9a63e60
        output_path: lib/external-secrets
    compile:
      # The recipe's Secret vaultwarden. External Secrets writes a Secret of
      # that name from Vault.
      - input_type: remove
        input_paths:
          - compiled/${kapitan.vars.target}/manifests/vaultwarden/vaultwarden-secret.yml
        output_path: .
      - input_type: kadet
        input_paths: [lib/external-secrets]
        output_path: manifests/
        output_type: yml
  applications:
    vaultwarden:
      domain: https://vaultwarden.example.com
      # The recipe requires it. Its Secret is removed above.
      admin_token: from-vault
  generators:
    kubernetes:
      secrets:
        vault-approle:
          string_data:
            secret-id:
              value: ?{gpg:vaultwarden/vault-secret-id}
    external_secrets:
      secretstores:
        vault:
          spec:
            provider:
              vault:
                server: http://vault.vault.svc.cluster.local:8200
                path: secret
                version: v2
                auth:
                  appRole:
                    path: approle
                    roleId: vaultwarden
                    secretRef:
                      name: vault-approle
                      key: secret-id
      externalsecrets:
        vaultwarden:
          store: vault
          refresh_interval: 10s
          spec:
            data:
              - secretKey: ADMIN_TOKEN
                remoteRef:
                  key: vaultwarden
                  property: admin_token
