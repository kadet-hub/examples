# The Vault that External Secrets reads from, standing in for one outside
# the cluster: a dev server that keeps everything in memory, reachable
# through its ClusterIP Service only. check creates the Secret vault-root
# with the root token and runs the vault CLI in this container.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    matchLabels: {app: vault}
  template:
    metadata:
      labels: {app: vault}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
          # The entrypoint adds -dev-root-token-id from VAULT_DEV_ROOT_TOKEN_ID
          # and listens on 0.0.0.0:8200.
          args: [server, -dev, -dev-no-store-token]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom: {secretKeyRef: {name: vault-root, key: token}}
            # For the vault CLI that check runs with kubectl exec.
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: VAULT_TOKEN
              valueFrom: {secretKeyRef: {name: vault-root, key: token}}
          ports:
            - {name: http, containerPort: 8200}
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: http}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector: {app: vault}
  ports:
    - {name: http, port: 8200, targetPort: http}
