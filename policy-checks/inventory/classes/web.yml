# podinfo as one Deployment with a Service. The targets add the namespace
# and what the policies look at.
parameters:
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - {input_type: kadet, output_type: yml, input_paths: [lib/kubernetes], output_path: .}
  components:
    web:
      command: [./podinfo, --port=8080]
      replicas: 2
      ports:
        http: {container_port: 8080, service_port: 80}
      healthcheck:
        readiness: {type: http, port: http, path: /readyz}
      service: {type: ClusterIP}
