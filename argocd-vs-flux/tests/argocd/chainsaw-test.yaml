# EX-7: the Application is Synced to the pushed commit and Healthy, the app's
# Deployment is available. EX-8: Argo CD undoes a manual scale on its own.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argocd
spec:
  timeouts:
    assert: 3m
  steps:
    - try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata: {name: web, namespace: argocd}
              status:
                sync:
                  status: Synced
                  revision: ($values.revision)
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata: {name: web, namespace: web}
              status:
                availableReplicas: 2
        - script:
            content: |
              created=$(kubectl -n argocd get application web -o jsonpath='{.metadata.creationTimestamp}')
              available=$(kubectl -n web get deploy web -o jsonpath='{.status.conditions[?(@.type=="Available")].lastTransitionTime}')
              echo "Deployment available $(( $(date -d "$available" +%s) - $(date -d "$created" +%s) ))s after the Application was created"
            check:
              ($error): ~
      catch:
        - events: {namespace: web}
        - events: {namespace: argocd}
        - podLogs: {namespace: argocd}
    - try:
        - script:
            timeout: 2m
            content: |
              kubectl -n web scale deploy/web --replicas=1 >/dev/null
              start=$(date +%s)
              until [ "$(kubectl -n web get deploy web -o jsonpath='{.spec.replicas}')" = 2 ]; do
                [ $(( $(date +%s) - start )) -lt 60 ] || { echo "replicas still 1 after 60s"; exit 1; }
                sleep 1
              done
              echo "replicas back to 2 after $(( $(date +%s) - start ))s"
            check:
              ($error): ~
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata: {name: web, namespace: argocd}
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
      catch:
        - events: {namespace: web}
        - events: {namespace: argocd}
        - podLogs: {namespace: argocd}
