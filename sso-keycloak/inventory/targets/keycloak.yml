# Keycloak from the published recipe, with the realm home, its users and one
# OIDC client per app, imported from the inventory on the first start.
classes:
  - recipes.keycloak
  - sso
parameters:
  namespace: keycloak
  kapitan:
    vars:
      target: keycloak
    # The Secrets below. The kubernetes generator comes with the recipes of
    # the apps, at the version they pin, into lib/kubernetes.
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    keycloak:
      host: ${sso.host}
      issuer:
        name: sso-ca
        kind: Issuer
    postgresql:
      # One node: further instances on it would share its disk.
      instances: 1
  sso:
    # Puts the group names into ID token and userinfo as the claim groups.
    groups_mapper:
      name: groups
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      config:
        claim.name: groups
        full.path: "false"
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
  generators:
    keycloak:
      instances:
        keycloak:
          hostname:
            hostname: ${sso.url}
      realm_imports:
        home:
          realm:
            realm: ${sso.realm}
            enabled: true
            # With clientScopes set, Keycloak creates its default client
            # scopes, such as profile and email, only with this attribute.
            attributes:
              CreateDefaultClientScopes: "true"
            # Keycloak's userinfo endpoint requires openid among the scopes of
            # the token. Mattermost asks for none, because with openid it
            # switches to its OpenID provider, which Team Edition lacks. As a
            # default scope of its client, openid is in the token all the same.
            clientScopes:
              - name: openid
                protocol: openid-connect
                attributes:
                  include.in.token.scope: "true"
                  display.on.consent.screen: "false"
            groups:
              - name: ${sso.clients.gitea.group}
              - name: ${sso.clients.open-webui.group}
              # A group no app admits.
              - name: family
            # ${escape:X} renders ${X}, which the import replaces with the
            # value of spec.placeholders.X.
            users:
              - username: alice
                email: alice@example.test
                emailVerified: true
                firstName: Alice
                lastName: Example
                enabled: true
                groups:
                  - /${sso.clients.gitea.group}
                  - /${sso.clients.open-webui.group}
                # Mattermost's user ID, a number unique in the realm.
                attributes:
                  mattermost_id:
                    - "1"
                credentials:
                  - type: password
                    value: ${escape:PASSWORD_ALICE}
              - username: bob
                email: bob@example.test
                emailVerified: true
                firstName: Bob
                lastName: Example
                enabled: true
                groups:
                  - /family
                attributes:
                  mattermost_id:
                    - "2"
                credentials:
                  - type: password
                    value: ${escape:PASSWORD_BOB}
            clients:
              - clientId: ${sso.clients.gitea.id}
                secret: ${escape:CLIENT_SECRET_GITEA}
                redirectUris:
                  - ${sso.clients.gitea.redirect_uri}
                protocolMappers:
                  - ${sso.groups_mapper}
              - clientId: ${sso.clients.open-webui.id}
                secret: ${escape:CLIENT_SECRET_OPEN_WEBUI}
                redirectUris:
                  - ${sso.clients.open-webui.redirect_uri}
                protocolMappers:
                  - ${sso.groups_mapper}
              - clientId: ${sso.clients.miniflux.id}
                secret: ${escape:CLIENT_SECRET_MINIFLUX}
                redirectUris:
                  - ${sso.clients.miniflux.redirect_uri}
              - clientId: ${sso.clients.mattermost.id}
                secret: ${escape:CLIENT_SECRET_MATTERMOST}
                redirectUris:
                  - ${sso.clients.mattermost.redirect_uri}
                defaultClientScopes:
                  - basic
                  - profile
                  - email
                  - openid
                protocolMappers:
                  # Mattermost reads the user ID from the integer id, as
                  # GitLab's API returns it.
                  - name: id
                    protocol: openid-connect
                    protocolMapper: oidc-usermodel-attribute-mapper
                    config:
                      user.attribute: mattermost_id
                      claim.name: id
                      jsonType.label: long
                      userinfo.token.claim: "true"
                      id.token.claim: "false"
                      access.token.claim: "false"
              - clientId: ${sso.clients.matrix-synapse.id}
                secret: ${escape:CLIENT_SECRET_MATRIX_SYNAPSE}
                redirectUris:
                  - ${sso.clients.matrix-synapse.redirect_uri}
                protocolMappers:
                  - ${sso.groups_mapper}
          spec:
            placeholders:
              PASSWORD_ALICE:
                secret:
                  name: sso-users
                  key: alice
              PASSWORD_BOB:
                secret:
                  name: sso-users
                  key: bob
              CLIENT_SECRET_GITEA:
                secret:
                  name: sso-clients
                  key: gitea
              CLIENT_SECRET_OPEN_WEBUI:
                secret:
                  name: sso-clients
                  key: open-webui
              CLIENT_SECRET_MINIFLUX:
                secret:
                  name: sso-clients
                  key: miniflux
              CLIENT_SECRET_MATTERMOST:
                secret:
                  name: sso-clients
                  key: mattermost
              CLIENT_SECRET_MATRIX_SYNAPSE:
                secret:
                  name: sso-clients
                  key: matrix-synapse
    certmanager:
      # The CA of the class sso signs Keycloak's certificate.
      issuers:
        sso-ca:
          spec:
            ca:
              secretName: sso-ca
    kubernetes:
      secrets:
        sso-ca:
          type: kubernetes.io/tls
          string_data:
            tls.crt:
              value: ${sso.ca}
            tls.key:
              value: ?{base64:sso/ca.key}
        sso-clients:
          string_data:
            gitea:
              value: ${sso.clients.gitea.secret}
            open-webui:
              value: ${sso.clients.open-webui.secret}
            miniflux:
              value: ${sso.clients.miniflux.secret}
            mattermost:
              value: ${sso.clients.mattermost.secret}
            matrix-synapse:
              value: ${sso.clients.matrix-synapse.secret}
        sso-users:
          string_data:
            alice:
              value: ?{base64:sso/alice-password||random:str:24}
            bob:
              value: ?{base64:sso/bob-password||random:str:24}
