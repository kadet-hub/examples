# A ClusterSecretStore that serves the Secrets of one namespace, through
# External Secrets' Kubernetes provider and a ServiceAccount allowed to
# read them.
classes:
  - generators
  - platform
parameters:
  namespace: ${platform.namespaces.secrets}
  kapitan:
    vars:
      target: external-secrets
    compile:
      - {input_type: kadet, output_type: yml, input_paths: [lib/kubernetes], output_path: .}
      - {input_type: kadet, output_type: yml, input_paths: [lib/external-secrets], output_path: .}
  generators:
    kubernetes:
      namespaces:
        secrets:
          name: ${platform.namespaces.secrets}
      service_accounts:
        store-reader: {}
      rbac:
        store-reader:
          namespace: ${platform.namespaces.secrets}
          service_accounts: [store-reader]
          rules:
            - {apiGroups: [""], resources: [secrets], verbs: [get, list, watch]}
    external_secrets:
      clustersecretstores:
        platform:
          name: ${platform.secret_store}
          spec:
            provider:
              kubernetes:
                remoteNamespace: ${platform.namespaces.secrets}
                server:
                  caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                    namespace: ${platform.namespaces.secrets}
                auth:
                  serviceAccount:
                    name: store-reader
                    namespace: ${platform.namespaces.secrets}
