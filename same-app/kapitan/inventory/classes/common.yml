parameters:
  namespace: shop
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths: [lib/kubernetes]
        output_path: manifests/
      - input_type: jinja2
        input_paths: [templates/endpoints.json]
        output_path: .
  generators:
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
