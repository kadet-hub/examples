parameters:
  namespace: shop
  kapitan:
    vars:
      target: ${_reclass_:name:short}
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.15.0@sha256:dc02ea8530be005377503155a52a9432975755c251cd30c2eaadbda44d331afa
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths: [lib/kubernetes]
        output_path: manifests/
      - input_type: jinja2
        input_paths: [templates/endpoints.json]
        output_path: .
  generators:
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
