apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    name: {{ .Release.Name }}
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    {{- include "app.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      protocol: TCP
      targetPort: http
