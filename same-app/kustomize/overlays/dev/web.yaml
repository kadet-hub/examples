apiVersion: v1
kind: ConfigMap
metadata:
  name: web
data:
  log_level: debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
