apiVersion: v1
kind: ConfigMap
metadata:
  name: web
data:
  log_level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
