apiVersion: v1
kind: ConfigMap
metadata:
  name: api
data:
  log_level: info
  web_url: http://web.shop.svc:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1Gi}
