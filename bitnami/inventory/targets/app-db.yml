parameters:
  kapitan:
    vars:
      target: app-db
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/cloudnative-pg:1.1.1@sha256:5881e6c467ab214158b816a1e5f582be1cb9a5c048c216f9c01111551cc048dc
        output_path: lib/cloudnative-pg
    compile:
      - output_path: manifests/
        input_type: kadet
        output_type: yml
        input_paths:
          - lib/cloudnative-pg

  namespace: databases
  generators:
    cloudnative-pg:
      clusters:
        app-db:
          image_name: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:44d17e8570dc25055376148a2918840def5bef0193969be3e79101afa25eafc2
          storage: 10Gi
          bootstrap:
            initdb:
              database: app
              owner: app
