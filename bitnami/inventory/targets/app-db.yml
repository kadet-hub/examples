parameters:
  kapitan:
    vars:
      target: app-db
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/cloudnative-pg:1.1.2@sha256:b17a561ad5867309ff024691e9427375202801588d546da1d6a6cc48e0cc1444
        output_path: lib/cloudnative-pg
    compile:
      - output_path: manifests/
        input_type: kadet
        output_type: yml
        input_paths:
          - lib/cloudnative-pg

  namespace: databases
  generators:
    cloudnative-pg:
      clusters:
        app-db:
          image_name: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:5a5dfbde88d5909fd4938189c141f53fb153f53c519f14907dce9e7c04baa153
          storage: 10Gi
          bootstrap:
            initdb:
              database: app
              owner: app
