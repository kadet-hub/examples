# Miniflux on Kubernetes: the recipe with its kubernetes generator, in a
# namespace of its own. postgres starts as root, so the namespace enforces
# the Pod Security level baseline.
classes:
  - recipes.miniflux
  - miniflux
parameters:
  namespace: miniflux
  kapitan:
    vars:
      target: cluster
  generators:
    kubernetes:
      namespaces:
        miniflux:
          labels:
            pod-security.kubernetes.io/enforce: baseline
  components:
    miniflux:
      # The recipe has none, and the rollout ended before Miniflux listened.
      # /healthcheck answers OK once Miniflux reaches its database.
      healthcheck:
        readiness:
          type: http
          port: http
          path: /healthcheck
