# EX-6: the StatefulSet is ready and the app user reaches its own database.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mysql
spec:
  timeouts:
    assert: 4m
  namespace: mysql
  steps:
    - try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata: {name: mysql}
              status:
                readyReplicas: 1
        - script:
            timeout: 1m
            content: |
              pass=$(kubectl -n mysql get secret mysql -o jsonpath='{.data.password}' | base64 -d)
              kubectl -n mysql exec mysql-0 -- mysql -h 127.0.0.1 -uapp -p"$pass" app -Nse 'select 1'
            check:
              ($error): ~
              (trim_space($stdout)): "1"
      catch:
        - events: {}
        - podLogs: {}
