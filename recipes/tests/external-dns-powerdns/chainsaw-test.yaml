# EX-6: PowerDNS and external-dns are ready, and PowerDNS answers an A record
# for an annotated Service with the Service's cluster IP.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-dns-powerdns
spec:
  namespace: dns
  steps:
    - try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata: {name: powerdns}
              status:
                readyReplicas: 1
        - assert:
            timeout: 5m
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata: {name: external-dns}
              status:
                readyReplicas: 1
        - apply:
            file: web-service.yaml
        - script:
            timeout: 2m
            content: |
              ip=$(kubectl -n dns get svc web -o jsonpath='{.spec.clusterIP}')
              for _ in $(seq 30); do
                out=$(kubectl -n dns exec powerdns-0 -c powerdns -- sdig 127.0.0.1 53 web.example.internal A || true)
                echo "$out" | grep -q "web.example.internal.*IN.*A.*$ip" && exit 0
                sleep 3
              done
              echo "no A record $ip for web.example.internal: $out" >&2
              exit 1
      catch:
        - events: {}
        - podLogs: {}
        - describe: {apiVersion: apps/v1, kind: StatefulSet}
        - describe: {apiVersion: apps/v1, kind: Deployment}
