# EX-6: Keycloak is Ready on its CloudNativePG database and serves the master realm over TLS.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keycloak
spec:
  namespace: keycloak
  steps:
    - try:
        - assert:
            timeout: 10m
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata: {name: keycloak-db}
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            timeout: 15m
            resource:
              apiVersion: k8s.keycloak.org/v2beta1
              kind: Keycloak
              metadata: {name: sso}
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - script:
            timeout: 2m
            content: |
              kubectl -n keycloak port-forward svc/sso-service 18443:8443 >/dev/null &
              trap 'kill $!' EXIT
              for _ in $(seq 30); do
                code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:18443/realms/master || true)
                [ "$code" = 200 ] && exit 0
                sleep 2
              done
              echo "/realms/master answered $code" >&2
              exit 1
      catch:
        - events: {}
        - podLogs: {}
        - describe: {apiVersion: k8s.keycloak.org/v2beta1, kind: Keycloak}
