# EX-6: the StatefulSet is ready and Valkey answers PING with the password.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: valkey
spec:
  namespace: valkey
  steps:
    - try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata: {name: valkey}
              status:
                readyReplicas: 1
        - script:
            timeout: 1m
            content: |
              pass=$(kubectl -n valkey get secret valkey -o jsonpath='{.data.password}' | base64 -d)
              kubectl -n valkey exec valkey-0 -- valkey-cli --no-auth-warning -a "$pass" ping
            check:
              ($error): ~
              (trim_space($stdout)): PONG
      catch:
        - events: {}
        - podLogs: {}
