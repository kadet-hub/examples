# The Keycloak Operator from its chart, which the project marks
# experimental, pinned by version and digest: CRDs and the operator in
# keycloak, watching only that namespace; the project calls the cluster-wide
# mode the chart defaults to a preview. The chart's values take the whole
# image reference, so it is pinned by digest there. The chart leaves the
# namespace of four objects to helm install; mutate sets it.
classes:
  - recipes.lib.kubernetes

parameters:
  generators:
    kubernetes:
      namespaces:
        keycloak: {}
  kapitan:
    dependencies:
      - type: helm
        source: oci://quay.io/keycloak/keycloak-operator-helm@sha256:650f7e1021def78ff799aa5ada703818a1a7d0e3cb6ee7eba6d5e1b557656a17
        chart_name: keycloak-operator-helm
        version: 26.8.1
        output_path: charts/keycloak-operator-helm
    compile:
      - input_type: helm
        input_paths: [charts/keycloak-operator-helm]
        output_path: operators/keycloak
        helm_params:
          name: keycloak-operator
          namespace: keycloak
        helm_values:
          operator:
            image: quay.io/keycloak/keycloak-operator:26.8.1@sha256:2f80ad73eaddbf2420e0b235cfe72ec568d053823f1ef4e3ff80b73d0984a0bc
            envs:
              QUARKUS_OPERATOR_SDK_CONTROLLERS_KEYCLOAKCONTROLLER_NAMESPACES: JOSDK_WATCH_CURRENT
              QUARKUS_OPERATOR_SDK_CONTROLLERS_KEYCLOAKOIDCCLIENTCONTROLLER_NAMESPACES: JOSDK_WATCH_CURRENT
              QUARKUS_OPERATOR_SDK_CONTROLLERS_KEYCLOAKREALMIMPORTCONTROLLER_NAMESPACES: JOSDK_WATCH_CURRENT
              QUARKUS_OPERATOR_SDK_CONTROLLERS_KEYCLOAKSAMLCLIENTCONTROLLER_NAMESPACES: JOSDK_WATCH_CURRENT
      - input_type: kadet
        input_paths: [lib/mutate]
        output_path: operators/keycloak
        output_type: plain
        input_params:
          mutations:
            namespace-deployment:
              match: {kind: Deployment, name: keycloak-operator}
              merge: {metadata: {namespace: keycloak}}
            namespace-rolebinding:
              match: {kind: RoleBinding, name: keycloak-operator-view}
              merge: {metadata: {namespace: keycloak}}
            namespace-service:
              match: {kind: Service, name: keycloak-operator}
              merge: {metadata: {namespace: keycloak}}
            namespace-serviceaccount:
              match: {kind: ServiceAccount, name: keycloak-operator}
              merge: {metadata: {namespace: keycloak}}
