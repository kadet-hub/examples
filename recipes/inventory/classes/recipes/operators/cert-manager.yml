# cert-manager from its chart, pinned by version and digest, with its CRDs,
# in cert-manager. The chart's values take an image digest, so this class
# needs no mutate entry; startupapicheck is a Helm hook that waits for the
# webhook during helm install and is left out.
classes:
  - recipes.lib.kubernetes

parameters:
  generators:
    kubernetes:
      namespaces:
        cert-manager: {}
  kapitan:
    dependencies:
      - type: helm
        source: oci://quay.io/jetstack/charts/cert-manager@sha256:e482675aec32862d323a9218293ff7de81192337998615e4378c56498473f240
        chart_name: cert-manager
        version: v1.21.3
        output_path: charts/cert-manager
    compile:
      - input_type: helm
        input_paths: [charts/cert-manager]
        output_path: operators/cert-manager
        helm_params:
          name: cert-manager
          namespace: cert-manager
        helm_values:
          crds:
            enabled: true
          startupapicheck:
            enabled: false
          image:
            repository: quay.io/jetstack/cert-manager-controller
            tag: v1.21.3
            digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
          webhook:
            image:
              repository: quay.io/jetstack/cert-manager-webhook
              tag: v1.21.3
              digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
          cainjector:
            image:
              repository: quay.io/jetstack/cert-manager-cainjector
              tag: v1.21.3
              digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
          acmesolver:
            image:
              repository: quay.io/jetstack/cert-manager-acmesolver
              tag: v1.21.3
              digest: sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
