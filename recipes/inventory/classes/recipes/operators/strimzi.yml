# The Strimzi Cluster Operator from its chart, pinned by version and digest:
# CRDs and the operator in strimzi, watching every namespace. The chart
# drops the tag when its values set a digest; mutate pins the operator image
# by tag and digest in the container and in the three variables that run the
# same image for the entity operator and the broker init container.
classes:
  - recipes.lib.kubernetes

parameters:
  operators:
    strimzi:
      image: quay.io/strimzi/operator:1.3.0@sha256:4deb564fa329afa4046c550a6f8f1a6d00be3b9297e556969acabe6647b6676f
  generators:
    kubernetes:
      namespaces:
        strimzi: {}
  kapitan:
    dependencies:
      - type: helm
        source: oci://quay.io/strimzi-helm/strimzi-kafka-operator@sha256:08852fb5aca9782750ec1698616cad0efe15d5eef1a366d124373129ff9c29ea
        chart_name: strimzi-kafka-operator
        version: 1.3.0
        output_path: charts/strimzi-kafka-operator
    compile:
      - input_type: helm
        input_paths: [charts/strimzi-kafka-operator]
        output_path: operators/strimzi
        helm_params:
          name: strimzi
          namespace: strimzi
        helm_values:
          watchAnyNamespace: true
      - input_type: kadet
        input_paths: [lib/mutate]
        output_path: operators/strimzi
        output_type: plain
        input_params:
          mutations:
            pin-image:
              match: {kind: Deployment, name: strimzi-cluster-operator}
              merge_lists: {containers: name, env: name}
              merge:
                spec:
                  template:
                    spec:
                      containers:
                        - name: strimzi-cluster-operator
                          image: ${operators:strimzi:image}
                          env:
                            - name: STRIMZI_DEFAULT_TOPIC_OPERATOR_IMAGE
                              value: ${operators:strimzi:image}
                            - name: STRIMZI_DEFAULT_USER_OPERATOR_IMAGE
                              value: ${operators:strimzi:image}
                            - name: STRIMZI_DEFAULT_KAFKA_INIT_IMAGE
                              value: ${operators:strimzi:image}
