# PostgreSQL with CloudNativePG, in place of Bitnami's postgresql and
# postgresql-ha charts: three instances with automatic failover, the database
# "app" owned by "app" (password in the Secret app-db-app) and a PgBouncer
# pooler in transaction mode. The CloudNativePG operator comes with it, from
# its Helm chart in recipes.operators.cloudnative-pg.
classes:
  - recipes.lib.kubernetes
  - recipes.lib.cloudnative-pg
  - recipes.operators.cloudnative-pg

parameters:
  generators:
    kubernetes:
      namespaces:
        databases: {}
    cloudnative-pg:
      namespace: databases
      clusters:
        app-db:
          instances: 3
          image_name: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e
          storage: 10Gi
          bootstrap:
            initdb:
              database: app
              owner: app
      poolers:
        app-db-pooler-rw:
          cluster: app-db
          pool_mode: transaction
