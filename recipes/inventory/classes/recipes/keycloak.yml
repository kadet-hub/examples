# Keycloak with the Keycloak Operator, in place of Bitnami's keycloak chart:
# one instance on the upstream image, its database on a CloudNativePG cluster
# and its TLS certificate from cert-manager. The initial admin is in the
# Secret sso-initial-admin. The Issuer is self-signed so the recipe runs
# anywhere; point the Certificate at your own issuer and set the hostname.
# cert-manager, the CloudNativePG operator and the Keycloak Operator come
# with it, from their Helm charts in recipes.operators.cert-manager,
# recipes.operators.cloudnative-pg and recipes.operators.keycloak.
classes:
  - recipes.lib.kubernetes
  - recipes.lib.cloudnative-pg
  - recipes.lib.certmanager
  - recipes.lib.keycloak
  - recipes.operators.cert-manager
  - recipes.operators.cloudnative-pg
  - recipes.operators.keycloak

parameters:
  generators:
    kubernetes:
      namespaces:
        keycloak: {}
    cloudnative-pg:
      clusters:
        keycloak-db:
          namespace: keycloak
          instances: 2
          image_name: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e
          storage: 10Gi
          bootstrap:
            initdb:
              database: keycloak
              owner: keycloak
    certmanager:
      issuers:
        keycloak-selfsigned:
          namespace: keycloak
          spec:
            selfSigned: {}
      certs:
        sso-tls:
          namespace: keycloak
          spec:
            secretName: sso-tls
            commonName: sso.example.com  # Keycloak rejects a certificate with an empty issuer DN
            issuerRef:
              name: keycloak-selfsigned
              kind: Issuer
            dnsNames:
              - sso.example.com
              - sso-service.keycloak.svc
    keycloak:
      instances:
        sso:
          namespace: keycloak
          instances: 1
          image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
          spec:
            startOptimized: false  # the operator assumes a prebuilt image when image is set
          db:
            vendor: postgres
            host: keycloak-db-rw
            database: keycloak
            credentials_secret: keycloak-db-app
          hostname:
            hostname: https://sso.example.com
          http:
            tls_secret: sso-tls
          ingress:
            enabled: false
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
