# Apache Kafka with Strimzi, in place of Bitnami's kafka chart: a KRaft
# cluster of three nodes that are controllers and brokers at once, an
# internal TLS listener with mutual TLS and ACLs, the topic "orders" and the
# user "orders-app" allowed to use it (its certificate is in the Secret
# orders-app). The Strimzi Cluster Operator comes with it, from its Helm
# chart in recipes.operators.strimzi.
classes:
  - recipes.lib.kubernetes
  - recipes.lib.strimzi
  - recipes.operators.strimzi

parameters:
  generators:
    kubernetes:
      namespaces:
        kafka: {}
    strimzi:
      namespace: kafka
      kafkas:
        events:
          version: 4.3.1
          metadata_version: 4.3-IV0
          node_pools:
            dual:
              roles: [controller, broker]
              replicas: 3
              storage: 10Gi
      topics:
        orders:
          partitions: 3
      users:
        orders-app:
          authentication: tls
          acls:
            - topic: orders
              operations: [Describe, Read, Write]
            - group: orders-app
              operations: [Read]
