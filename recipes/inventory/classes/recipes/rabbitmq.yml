# RabbitMQ with the RabbitMQ Cluster Operator, in place of Bitnami's rabbitmq
# chart: three nodes on the official image, with persistent queues. The
# default user's credentials are in the Secret production-default-user.
# Needs the RabbitMQ Cluster Operator, which takes its webhook certificate
# from cert-manager. Queues, users and policies come from the same generator
# but need the Messaging Topology Operator, which this recipe leaves out.
classes:
  - recipes.lib.kubernetes
  - recipes.lib.rabbitmq

parameters:
  generators:
    kubernetes:
      namespaces:
        messaging: {}
    rabbitmq:
      namespace: messaging
      rabbitmqcluster:
        production:
          spec:
            image: docker.io/library/rabbitmq:4.3.4-management
            replicas: 3
            persistence:
              storage: 10Gi
            resources:
              requests: {cpu: 250m, memory: 1Gi}
              limits: {memory: 1Gi}
