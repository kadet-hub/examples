# podinfo's chart, pinned by version and by the digest of its OCI artifact,
# rendered with Kapitan's helm input into compiled/<target>/podinfo.
parameters:
  kapitan:
    dependencies:
      - type: helm
        source: oci://ghcr.io/stefanprodan/charts/podinfo@sha256:258d0da545724b4eea8de5d5e724cd9a75aab3de79a87ba8d82ec402745cea58
        chart_name: podinfo
        version: 6.17.0
        output_path: charts/podinfo
    compile:
      - input_type: helm
        input_paths: [charts/podinfo]
        output_path: podinfo
        helm_params:
          name: podinfo
          namespace: podinfo
          # Kapitan passes --skip-tests by default; the chart's helm test Pods
          # are rendered so that a mutation can remove them.
          skip_tests: false
