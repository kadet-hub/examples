# The chart patched by mutate: the second compile entry rewrites the files the
# helm entry wrote to the same output_path.
classes:
  - generators
  - podinfo

parameters:
  kapitan:
    vars:
      target: podinfo
    compile:
      - input_type: kadet
        input_paths: [lib/mutate]
        output_path: podinfo
        output_type: plain
        input_params:
          mutations: ${mutations}
  mutations:
    # Pin the image by tag and digest; the chart's values take a tag only.
    pin-image:
      match: {kind: Deployment, name: podinfo}
      images:
        ghcr.io/stefanprodan/podinfo:
          tag: 6.17.0
          digest: sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
    # Restricted Pod Security for the container, and a memory limit, merged
    # into the container named podinfo instead of replacing the list. The
    # image's user is the name app, which runAsNonRoot cannot verify without
    # a numeric runAsUser.
    harden:
      match: {kind: Deployment, name: podinfo}
      merge_lists: {containers: name}
      merge:
        spec:
          template:
            spec:
              containers:
                - name: podinfo
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities: {drop: [ALL]}
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    runAsUser: 65534
                    seccompProfile: {type: RuntimeDefault}
                  resources:
                    limits: {memory: 64Mi}
    # Every Service of the chart, whatever its name.
    service-owner:
      match: {kind: Service}
      merge:
        metadata:
          annotations:
            example.com/owner: platform
    # Two replicas, but only while the chart still renders one.
    replicas:
      match: {kind: Deployment, name: podinfo}
      json6902:
        - {op: test, path: /spec/replicas, value: 1}
        - {op: replace, path: /spec/replicas, value: 2}
    # helm test Pods: plain kubectl apply, Argo CD and Flux would create them
    # as ordinary Pods.
    no-test-pods:
      match: {kind: Pod, labels: {app.kubernetes.io/name: podinfo}}
      delete: true
