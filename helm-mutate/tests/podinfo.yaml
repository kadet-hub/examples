# EX-10: the patched Deployment is available under restricted Pod Security,
# the Service carries the annotation.
apiVersion: apps/v1
kind: Deployment
metadata: {name: podinfo, namespace: podinfo}
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0@sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
          securityContext:
            runAsNonRoot: true
          resources:
            limits: {memory: 64Mi}
status:
  availableReplicas: 2
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: podinfo
  annotations:
    example.com/owner: platform
