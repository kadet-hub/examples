# One app: workload, Service, TLS certificate and network policy.
parameters:
  namespace: shop
  generators:
    kubernetes:
      namespaces:
        shop: {}
    manifest:
      default_config:
        recommended_labels: true
        security_profile: restricted
    cilium:
      network_policies:
        web:
          endpoint_selector:
            match_labels: {name: web}
          ingress:
            - fromEntities: [ingress]
              ports: [8080]
          allow_dns: true
    certmanager:
      certs:
        web:
          spec:
            secretName: web-tls
            issuerRef: {name: letsencrypt, kind: ClusterIssuer}
            dnsNames:
              - ${hostname}
  components:
    web:
      image: ghcr.io/stefanprodan/podinfo:6.17.0@sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
      command: [./podinfo, --port=8080]
      security_context: {runAsUser: 65534}
      replicas: ${replicas}
      ports:
        http: {container_port: 8080, service_port: 80}
      healthcheck:
        readiness: {type: http, port: http, path: /readyz}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
      service: {type: ClusterIP}
